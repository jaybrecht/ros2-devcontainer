# Isaac Sim, from NVIDIA's image (nvcr.io/nvidia/isaac-sim) with ROS added; see the
# Dockerfile. Run it in the container with /isaac-sim/python.sh. Needs
# compose/gpu-cdi.yml (or gpu.yml) too. Set ISAACSIM_VERSION in .env to change the version.
#
# ipc: host gives the container the host's /dev/shm instead of Docker's 64 MB
# default, which Isaac Sim and Fast DDS shared memory need.
services:
  ros:
    build:
      args:
        BASE: isaacsim
        ISAACSIM_VERSION: ${ISAACSIM_VERSION:-6.2.0}
    ipc: host
    # isaacsim.ros2.control puts Isaac's own Jazzy prefixes ahead of /opt/ros/jazzy at
    # runtime, so pluginlib loads Isaac's plugins (e.g. libsdformat_urdf_plugin.so). Their
    # extra deps (libtinyxml2.so.9) are only in these dirs, and the loader only reads
    # LD_LIBRARY_PATH at process start. Sourcing ROS prepends /opt/ros/jazzy, so system
    # libraries still win wherever both have one.
    environment:
      LD_LIBRARY_PATH: /isaac-sim/exts/isaacsim.ros2.control/jazzy/lib:/isaac-sim/exts/isaacsim.ros2.core/jazzy/lib
      # /isaac-sim isn't writable by the container user, so Python keeps its
      # bytecode cache in ~/.cache (a volume, below). Runtime only: set at build
      # time, root's Python runs would create /home/dev before the user exists.
      PYTHONPYCACHEPREFIX: /home/dev/.cache/pycache
    devices:
      - /dev/nvidia-modeset
    # Compiled shaders and Python bytecode, kept across rebuilds. Without them the
    # first launch after a rebuild takes ~3 minutes instead of ~20 s.
    volumes:
      - isaacsim-kit-cache:/isaac-sim/kit/cache
      - isaacsim-user-cache:/home/dev/.cache

volumes:
  # Fixed names (no project prefix), so every workspace on this machine shares them.
  isaacsim-kit-cache:
    name: isaacsim-${ISAACSIM_VERSION:-6.2.0}-kit-cache
  isaacsim-user-cache:
    name: isaacsim-${ISAACSIM_VERSION:-6.2.0}-user-cache
