# Base service. Platform and GPU options are separate overlay files in
# compose/, chosen by COMPOSE_FILE in .env (see .env.example).
services:
  ros:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    network_mode: host
    volumes:
      - ./src:/ws/src
    command: sleep infinity
